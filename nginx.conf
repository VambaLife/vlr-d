# Generated by scripts/build.mjs. Review before adding to nginx.conf.

server {
    listen 80;
    listen [::]:80;
    server_name vlr-dmitrov.pages.dev www.vlr-dmitrov.pages.dev;
    return 301 https://vlr-dmitrov.pages.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vlr-dmitrov.pages.dev;

    root /var/www/vlr-dmitrov;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/vlr-dmitrov.pages.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vlr-dmitrov.pages.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    include /var/www/vlr-dmitrov/assets/config/csp-script-hashes.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' $csp_script_hashes; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    client_max_body_size 64k;
    etag on;
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml;
    # Enable and install ngx_brotli before uncommenting these directives.
    # brotli on;
    # brotli_types text/css application/javascript application/json image/svg+xml;

    error_page 404 /404.html;
    error_page 500 /500.html;

    location = /properties {
        return 301 /properties/;
    }
    location = /properties.html {
        return 301 /properties/;
    }

    location = /api/csrf.php {
        limit_except GET { deny all; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass /run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 15s;
        fastcgi_hide_header X-Powered-By;
    }
    location = /api/send.php {
        limit_except POST { deny all; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass /run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 15s;
        fastcgi_hide_header X-Powered-By;
    }
    location = /api/subscribe.php {
        limit_except GET POST { deny all; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass /run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 15s;
        fastcgi_hide_header X-Powered-By;
    }
    location ^~ /api/ { return 404; }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/vlr-dmitrov;
        default_type text/plain;
    }
    location ~ ^/(?:app|config|logs|storage|backup|src|scripts|tests|node_modules|vendor|\.git)(?:/|$) { return 404; }
    location ~ (^|/)\. { return 404; }
    location ~* \.(?:md|json|log|sqlite|sqlite-wal|sqlite-shm|ini|env|conf|sh|yml|yaml|bak|sql)$ { return 404; }
    location ~ \.php$ { return 404; }

    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }
    location ~* \.(?:css|js)$ {
        expires 7d;
        try_files $uri =404;
    }
    location ~* \.(?:jpg|jpeg|png|webp|avif|svg|ico|woff2|mp4)$ {
        expires 30d;
        try_files $uri =404;
    }
    location = /robots.txt { expires 1h; try_files $uri =404; }
    location = /sitemap.xml { expires 1h; try_files $uri =404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
